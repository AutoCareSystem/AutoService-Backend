services:
  auth-service:
    build:
      context: ./Authentication_Service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5001:8080"
    env_file:
      - ./Authentication_Service/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  service-management-service:
    build:
      context: ./Service_Management_Service
      dockerfile: Dockerfile
    container_name: service-management-service
    ports:
      - "5002:8080"
    env_file:
      - ./Service_Management_Service/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  notification-service:
    build:
      context: ./Notification_Service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "5003:8080"
    env_file:
      - ./Notification_Service/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  chatbot-service:
    build:
      context: ./Chatbot_Service
      dockerfile: Dockerfile
    container_name: chatbot-service
    ports:
      - "5004:8080"
    env_file:
      - ./Chatbot_Service/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

