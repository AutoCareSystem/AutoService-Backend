version: '3.9'

services:
  auth-service:
    build:
      context: ./Authentication_Service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5001:8080"
    env_file:
      - ./Authentication_Service/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - postgres

  service-management-service:
    build:
      context: ./Service_Management_Service
      dockerfile: Dockerfile
    container_name: service-management-service
    ports:
      - "5002:8080"
    env_file:
      - ./Service_Management_Service/.env
    depends_on:
      - postgres

  notification-service:
      build:
        context: ./Notification_Service
        dockerfile: Dockerfile
      container_name: notification-service
      ports:
        - "5003:8080"
      env_file:
        - ./Notification_Service/.env
      depends_on:
        - postgres

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: autoservice
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
